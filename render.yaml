services:
  - type: web
    name: collabchatboardbybenjamin
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run db:generate --workspace=server && npm run db:migrate:deploy --workspace=server && npm run build --workspace=server
    startCommand: npm start --workspace=server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production

  - type: static
    name: collabchat-board-client
    rootDir: .
    buildCommand: npm install && npm run build --workspace=packages/shared && npm run build --workspace=client
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://collabchatboardbybenjamin.onrender.com
      - key: VITE_SOCKET_URL
        value: https://collabchatboardbybenjamin.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
